plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"packbrowser" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Only the two Fabric API modules we need, bundled into the jar (full Fabric API not required)
	implementation include(fabricApi.module("fabric-api-base", project.fabric_api_version))
	implementation include(fabricApi.module("fabric-screen-api-v1", project.fabric_api_version))

	// Pure-Java WebP decoder for Modrinth icons (bundled into the mod jar)
	def tm = project.twelvemonkeys_version
	[
		"com.twelvemonkeys.imageio:imageio-webp",
		"com.twelvemonkeys.imageio:imageio-core",
		"com.twelvemonkeys.imageio:imageio-metadata",
		"com.twelvemonkeys.common:common-lang",
		"com.twelvemonkeys.common:common-io",
		"com.twelvemonkeys.common:common-image"
	].each {
		implementation "${it}:${tm}"
		include "${it}:${tm}"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
